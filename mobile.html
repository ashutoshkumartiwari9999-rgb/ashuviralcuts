<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0912">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>AshuViralCuts Phone Remote</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0912;--panel:#171320;--line:#30263e;--pink:#ff4ba5;--cyan:#58e8f7;--lime:#d4fb58;--muted:#a99db7;--white:#fbf6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.5 'Segoe UI',sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{max-width:760px;margin:auto;padding:20px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--pink);letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.16em}main{max-width:760px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin:12px 0}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}h1{font-size:23px;margin:0 0 12px}h2{font-size:18px;margin:0 0 12px}p{color:var(--muted);margin:8px 0}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select,button{font:inherit;border-radius:9px;padding:12px;border:1px solid var(--line);background:#100c17;color:var(--white);min-width:0}input,select{width:100%}button{background:#241c31;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55}.primary{background:var(--pink);border-color:var(--pink);color:#1c0714;font-weight:800}.secondary{border-color:#3e757d;color:var(--cyan)}.danger{color:#ff9bc9}.status{min-height:24px;color:var(--cyan);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.clip{padding:9px;border:1px solid var(--line);border-radius:12px;background:#100c17}.clip video{display:block;width:100%;max-height:340px;aspect-ratio:9/16;background:#000;border-radius:7px}.clip b{display:block;margin:7px 0;font-size:13px;overflow-wrap:anywhere}.clip a{color:var(--cyan)}.empty{padding:15px;color:var(--muted);text-align:center}.small{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:420px){.panel{padding:14px}.row>*{flex-basis:100%}.row button{width:100%}header{padding-top:15px}}
    summary{cursor:pointer;color:var(--cyan);font-weight:700}.live-tools>section{padding-top:12px}
  </style>
</head>
<body>
  <header><div class="brand">A↗ ASHUVIRALCUTS<small>PHONE REMOTE</small></div><button id="reload" class="secondary" type="button">Refresh</button></header>
  <main>
    <section id="login" class="panel" hidden><h1>Connect to your studio</h1><p>Enter the six-digit PIN shown on the computer running AshuViralCuts.</p><form id="login-form"><label for="pin">Studio PIN</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><div class="row" style="margin-top:12px"><button class="primary">Connect</button></div></form><div id="login-status" class="status" aria-live="polite"></div></section>
    <div id="studio" hidden>
      <details class="panel live-tools"><summary>Live clipping tools</summary><section><div class="row"><input id="live-url" type="url" placeholder="Twitch channel or YouTube Live link"><button id="live-start" class="primary" type="button">Start clipping</button></div><div class="row" style="margin-top:10px"><button id="clip-now" class="secondary" type="button" disabled>Clip the last 30 seconds</button><button id="live-stop" class="danger" type="button" disabled>Stop session</button></div><p id="live-status" class="status" role="status">Checking for an active session…</p><div id="live-clips" class="grid"></div></section></details>
      <section class="panel"><h1>Make clips</h1><label for="make-url">Video link</label><input id="make-url" type="url" placeholder="Paste a YouTube URL"><div class="row"><label>Number of clips<select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>Clip length · <output id="length-value">30</output> sec<input id="length" type="range" min="10" max="120" step="1" value="30"></label></div><button id="make" class="primary" type="button">Generate clips</button><p id="make-status" class="status" role="status"></p><div id="make-clips" class="grid"></div></section>
      <section class="panel"><div class="row"><h2 style="margin:0">Saved clips</h2><button id="library-refresh" class="secondary" type="button">Refresh library</button></div><div id="library" class="grid"><div class="empty">Loading your clips…</div></div></section>
      <p class="small">Secure phone remote · available on your local Wi-Fi.</p>
    </div>
  </main>
  <script src="/assets/mobile.js?v=20261123-shorts" defer></script>
</body>
</html>
