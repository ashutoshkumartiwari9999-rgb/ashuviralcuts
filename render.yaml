services:
  - type: web
    name: ashuviralcuts
    env: python
    region: singapore
    # Free tier has ephemeral storage; app data is not durable across restarts.
    plan: free
    healthCheckPath: /healthz
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq ffmpeg
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: NEONCLIPPING_DATA_DIR
        value: /tmp/ashuviralcuts_data
      - key: NEONCLIPPING_REQUIRE_AUTH
        value: "1"
      - key: NEONCLIPPING_AUTH_PASSWORD
        sync: false
      - key: NEONCLIPPING_STORAGE_BUDGET_MB
        value: "800"
      - key: NEONCLIPPING_STORAGE_RESERVE_MB
        value: "96"
      - key: NEONCLIPPING_MAX_UPLOAD_MB
        value: "300"
