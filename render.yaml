services:
  - type: web
    name: ashuviralcuts
    env: python
    region: singapore
    # Free tier has ephemeral storage; app data is not durable across restarts.
    plan: free
    healthCheckPath: /healthz
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq ffmpeg curl
      export DENO_INSTALL=/opt/render/project/src/.deno
      curl -fsSL https://deno.land/install.sh | sh
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: export PATH=/opt/render/project/src/.deno/bin:$PATH && python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: NEONCLIPPING_DATA_DIR
        value: /tmp/ashuviralcuts_data
      - key: NEONCLIPPING_REQUIRE_AUTH
        value: "0"
      - key: NEONCLIPPING_PRIVATE_COOKIE_ADMIN
        value: "1"
      - key: NEONCLIPPING_PUBLIC_MODE
        value: "1"
      - key: NEONCLIPPING_AUTH_PASSWORD
        sync: false
      - key: NEONCLIPPING_STORAGE_BUDGET_MB
        value: "800"
      - key: NEONCLIPPING_STORAGE_RESERVE_MB
        value: "96"
      - key: NEONCLIPPING_MAX_UPLOAD_MB
        value: "300"
      - key: NEONCLIPPING_MAKE_WORKERS
        value: "1"
